<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create account</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F0B45E}a:hover{color:#FFD08A}
input::placeholder{color:#9C8C99}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #2B2230; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #F3ECF1; display: flex; flex-direction: column; gap: 20px; padding: 22px 24px 28px 24px; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 16px">
    <a href="Login.dc.html" aria-label="Back to sign in" style="width: 46px; height: 46px; border-radius: 16px; background: #2B2230; box-shadow: 5px 5px 12px #1A1420, -5px -5px 12px #3C3042; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F3ECF1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.4px">Create account</h1>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 6px; border-radius: 20px; box-shadow: inset 4px 4px 9px #1A1420, inset -4px -4px 9px #3C3042">
    <button type="button" onClick="{{ pickStudent }}" aria-pressed="{{ studentPressed }}" style="{{ studentStyle }}">Student</button>
    <button type="button" onClick="{{ pickStaff }}" aria-pressed="{{ staffPressed }}" style="{{ staffStyle }}">Campus staff</button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 9px">
    <label for="name" style="font-size: 13.5px; font-weight: 700">Full name</label>
    <input id="name" type="text" value="Amani Mugisha" style="height: 52px; box-sizing: border-box; border-radius: 18px; border: 0; background: #2B2230; box-shadow: inset 4px 4px 9px #1A1420, inset -4px -4px 9px #3C3042; padding: 0 18px; font: inherit; font-size: 15px; color: #F3ECF1; outline: none">
  </div>

  <div style="display: flex; flex-direction: column; gap: 9px">
    <label for="semail" style="font-size: 13.5px; font-weight: 700">Campus email</label>
    <input id="semail" type="email" value="a.mugisha@alustudent.com" style="height: 52px; box-sizing: border-box; border-radius: 18px; border: 0; background: #2B2230; box-shadow: inset 4px 4px 9px #1A1420, inset -4px -4px 9px #3C3042; padding: 0 18px; font: inherit; font-size: 15px; color: #F3ECF1; outline: none">
  </div>

  <sc-if value="{{ isStaff }}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; gap: 9px">
      <label for="staffid" style="font-size: 13.5px; font-weight: 700">Staff ID</label>
      <input id="staffid" type="text" placeholder="e.g. FAC-0231" style="height: 52px; box-sizing: border-box; border-radius: 18px; border: 0; background: #2B2230; box-shadow: inset 4px 4px 9px #1A1420, inset -4px -4px 9px #3C3042; padding: 0 18px; font: inherit; font-size: 15px; color: #F3ECF1; outline: none">
      <span style="font-size: 12.5px; color: #B9A9B6">Staff accounts are approved by the facilities office.</span>
    </div>
  </sc-if>

  <div style="display: flex; flex-direction: column; gap: 9px">
    <label for="spass" style="font-size: 13.5px; font-weight: 700">Password</label>
    <input id="spass" type="password" value="campus2026" style="height: 52px; box-sizing: border-box; border-radius: 18px; border: 0; background: #2B2230; box-shadow: inset 4px 4px 9px #1A1420, inset -4px -4px 9px #3C3042; padding: 0 18px; font: inherit; font-size: 15px; color: #F3ECF1; letter-spacing: 2px; outline: none">
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="flex: 1; height: 6px; border-radius: 3px; background: #DB9734"></span>
      <span style="flex: 1; height: 6px; border-radius: 3px; background: #DB9734"></span>
      <span style="flex: 1; height: 6px; border-radius: 3px; box-shadow: inset 2px 2px 3px #1A1420, inset -2px -2px 3px #3C3042"></span>
      <span style="font-size: 12.5px; font-weight: 700; color: #F0B45E; margin-left: 4px">Medium</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 9px">
    <label for="sconfirm" style="font-size: 13.5px; font-weight: 700">Confirm password</label>
    <input id="sconfirm" type="password" value="campus20" aria-describedby="confirmerr" style="height: 52px; box-sizing: border-box; border-radius: 18px; border: 1.5px solid #FF8A80; background: #2B2230; box-shadow: inset 4px 4px 9px #1A1420, inset -4px -4px 9px #3C3042; padding: 0 18px; font: inherit; font-size: 15px; color: #F3ECF1; letter-spacing: 2px; outline: none">
    <span id="confirmerr" style="font-size: 12.5px; font-weight: 700; color: #FF8A80">Passwords do not match</span>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 18px">
    <a href="{{ ctaHref }}" style="height: 58px; border-radius: 20px; background: #DB9734; color: #2A1424; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; box-shadow: 6px 6px 14px #1A1420, -6px -6px 14px #3C3042">Create account</a>
    <p style="margin: 0; text-align: center; font-size: 14px; color: #B9A9B6">Already have an account? <a href="Login.dc.html" style="font-weight: 800; text-decoration: none">Sign in</a></p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { role: 'student' };
  }
  renderVals() {
    const base = 'height: 46px; border: 0; border-radius: 15px; font-family: inherit; font-size: 14px; cursor: pointer;';
    const on = base + ' background: #2B2230; color: #F0B45E; font-weight: 800; box-shadow: 4px 4px 9px #1A1420, -4px -4px 9px #3C3042;';
    const off = base + ' background: transparent; color: #B9A9B6; font-weight: 700;';
    const student = this.state.role === 'student';
    return {
      isStaff: !student,
      studentStyle: student ? on : off,
      staffStyle: student ? off : on,
      studentPressed: student ? 'true' : 'false',
      staffPressed: student ? 'false' : 'true',
      ctaHref: student ? 'Home.dc.html' : 'StaffHome.dc.html',
      pickStudent: () => this.setState({ role: 'student' }),
      pickStaff: () => this.setState({ role: 'staff' })
    };
  }
}
</script>
</body>
</html>
